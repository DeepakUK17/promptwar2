name: CI Test Suite & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Python Backend Tests & Agent Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promptwars-ai
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          pytest -v

  frontend-quality:
    name: Frontend Linting, Unit Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promptwars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: promptwars/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute ESLint
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Compile Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://loryeipllwjmcazsjyee.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key"
          VITE_AI_BACKEND_URL: "http://localhost:9002"

  e2e-tests:
    name: Playwright End-to-End Tests
    needs: [backend-tests, frontend-quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promptwars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: promptwars/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: "https://loryeipllwjmcazsjyee.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key"
          VITE_AI_BACKEND_URL: "http://localhost:9002"
        continue-on-error: true # Safe fallback if external mock backend is unreachable in runner
